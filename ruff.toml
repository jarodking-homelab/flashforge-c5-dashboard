# 132 is the longest line server.py had when linting started; do not let it grow.
line-length = 132
target-version = "py311"

[lint]
# E/W style, F pyflakes, B likely bugs, S security (bandit rules)
select = ["E", "W", "F", "B", "S"]

[lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test
